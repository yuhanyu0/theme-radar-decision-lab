theme: Genomics_Bio
version: "0.1-public-seed"

# Public discovery seed only. All members require independent primary-source
# validation before promotion. effective_from is the date this research system
# first admitted the candidate, preventing retroactive theme-basket membership.
layers:
  - name: genome_editing_therapeutics
    description: In-vivo/ex-vivo gene editing, base editing and prime editing therapeutics.
  - name: gene_therapy_delivery
    description: Gene-therapy platforms and delivery technologies for genomic medicines.
  - name: sequencing_enabling_tools
    description: Sequencing instruments, long-read platforms, synthetic biology and single-cell/spatial tools.
  - name: genomic_diagnostics
    description: Genomic and multi-omic diagnostics, screening and disease-monitoring platforms.

