theme: DataCenter_Infra
version: "0.1-public-seed"

# Public research seed only. Membership is not an investment recommendation and
# must be independently revalidated from primary evidence before promotion.
layers:
  - name: power_time_to_power
    description: On-site generation, merchant/contracted generation, time-to-power solutions.
  - name: grid_interconnection
    description: Grid equipment, generation/grid interface, transmission/interconnection bottlenecks.
  - name: electrical_switchgear
    description: Power distribution, switchgear, protection, UPS and electrical balance-of-plant.
  - name: thermal_liquid_cooling
    description: HVAC, thermal management and direct/indirect liquid cooling.
  - name: epc_mep
    description: Engineering, procurement, construction and MEP delivery.
  - name: network_interconnect_optics
    description: High-speed networking, copper/optical interconnect and connectivity.
  - name: datacenter_ownership
    description: Data-center ownership/operation and colocation real estate.

