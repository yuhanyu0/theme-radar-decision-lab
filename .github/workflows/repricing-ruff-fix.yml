name: Repricing Ruff Autofix

on:
  push:
    branches:
      - design/repricing-graph-investment-system

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Apply safe Ruff fixes
        run: ruff check --fix experiments/repricing_graph_v0_1
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- experiments/repricing_graph_v0_1; then
            echo "No Ruff changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/repricing_graph_v0_1
          git commit -m "style: apply Ruff fixes to repricing experiment"
          git push
