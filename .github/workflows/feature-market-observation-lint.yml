name: Feature Market Observation Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff changed files
        run: >-
          python -m ruff check
          src/decision_lab/market_observation.py
          src/decision_lab/__init__.py
          tests/test_market_observation.py
