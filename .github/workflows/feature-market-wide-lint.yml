name: Feature Market-wide Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff changed files
        run: >-
          python -m ruff check
          src/decision_lab/__init__.py
          src/decision_lab/themes.py
          src/decision_lab/adapters.py
          src/decision_lab/hierarchical.py
          src/decision_lab/universe.py
          src/decision_lab/controls.py
          tests/test_themes.py
          tests/test_theme_package_compat.py
          tests/test_adapters.py
          tests/test_hierarchical.py
          tests/test_radar_and_controls.py
