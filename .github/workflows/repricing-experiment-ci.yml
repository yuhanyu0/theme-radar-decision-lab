name: Repricing Experiment CI
on:
  pull_request:
    paths:
      - experiments/repricing_graph_v0_1/**
      - .github/workflows/repricing-experiment-ci.yml
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical context and existing dev tools
        run: pip install -e '.[dev]' 'numpy==2.3.5' 'pandas==2.2.3' 'PyYAML==6.0.3'
      - name: Verify unchanged production and record exact head
        run: |
          mkdir -p validation
          git rev-parse HEAD | tee validation/HEAD.txt
          git diff --exit-code c5866ad8f09a472cf631a764f911547c05d337d9 -- src tests schemas pyproject.toml
          pip freeze > validation/environment.txt
      - name: Original regression
        run: pytest -q | tee validation/original-tests.log
      - name: Experimental regression
        run: pytest -q experiments/repricing_graph_v0_1/test_*.py | tee validation/experiment-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: repricing-native-recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36226436352
          path: captured
      - name: Freeze and independently repeat real input snapshot
        env:
          PYTHONPATH: src:.
        run: |
          python -m experiments.repricing_graph_v0_1.run_shadow --market-dir captured/market --output validation/shadow_report.json
          python -m experiments.repricing_graph_v0_1.run_shadow --market-dir captured/market --output validation/shadow_report_repeat.json
          cmp validation/shadow_report.json validation/shadow_report_repeat.json
          cp -r captured/market validation/market
      - name: Ruff qualification
        run: ruff check experiments/repricing_graph_v0_1/*.py | tee validation/ruff.log
      - name: Source bundle
        if: always()
        run: |
          git bundle create validation/repository.bundle HEAD
          sha256sum validation/repository.bundle > validation/repository.bundle.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etn-native-qualification
          path: validation/
          retention-days: 30
          if-no-files-found: error
