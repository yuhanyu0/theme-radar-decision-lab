name: Repricing native recovery snapshot
on:
  push:
    branches: [feature/repricing-graph-etn-shadow-v0-1]
    paths: [.github/workflows/repricing-native-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: pip install -e '.[dev]'
      - name: Capture baseline and expected RED without changing source
        shell: bash
        run: |
          mkdir -p recovery/market
          git rev-parse HEAD > recovery/HEAD.txt
          git log --format='%H %s' -60 > recovery/commits.txt
          set +e
          pytest -q > recovery/original-tests.log 2>&1
          echo $? > recovery/original-tests.exit
          pytest -q experiments/repricing_graph_v0_1/test_*.py > recovery/experiment-tests.log 2>&1
          echo $? > recovery/experiment-tests.exit
          ruff check experiments/repricing_graph_v0_1/*.py > recovery/ruff.log 2>&1
          echo $? > recovery/ruff.exit
          set -e
          git bundle create recovery/repository.bundle --all
          sha256sum recovery/repository.bundle > recovery/repository.bundle.sha256
      - name: Fetch fixed market context only, not alpha or outcomes
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, json, pathlib
          import yfinance as yf
          out = pathlib.Path('recovery/market')
          receipt = {'provider': 'Yahoo via yfinance', 'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'start': '2026-05-01', 'end_exclusive': '2026-09-26', 'auto_adjust': False, 'scope': 'current-vintage historical prices for current context; not a historical PIT archive', 'symbols': {}}
          for symbol in ('ETN','POWL','NVT','SPY','XLI'):
              try:
                  frame = yf.Ticker(symbol).history(start='2026-05-01', end='2026-09-26', auto_adjust=False, actions=True, raise_errors=True)
                  if frame.empty:
                      raise ValueError('no data')
                  path = out / (symbol + '.csv')
                  frame.to_csv(path)
                  receipt['symbols'][symbol] = {'status': 'FETCHED', 'rows': len(frame), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'first_session': str(frame.index[0]), 'last_session': str(frame.index[-1])}
              except Exception as exc:
                  receipt['symbols'][symbol] = {'status': 'UNAVAILABLE', 'error': str(exc)}
          (out/'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repricing-native-recovery
          path: recovery/
          retention-days: 7
          if-no-files-found: error
