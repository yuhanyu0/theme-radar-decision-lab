name: Repricing native recovery snapshot
on:
  push:
    branches: [feature/repricing-graph-etn-shadow-v0-1]
    paths: [.github/workflows/repricing-native-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: pip install -e '.[dev]'
      - name: Capture baseline and current expected RED without changing source
        shell: bash
        run: |
          mkdir -p recovery
          git rev-parse HEAD > recovery/HEAD.txt
          git log --format='%H %s' -60 > recovery/commits.txt
          git diff c5866ad8f09a472cf631a764f911547c05d337d9 --stat > recovery/diff-stat.txt
          set +e
          pytest -q > recovery/original-tests.log 2>&1
          echo $? > recovery/original-tests.exit
          pytest -q experiments/repricing_graph_v0_1/test_*.py > recovery/experiment-tests.log 2>&1
          echo $? > recovery/experiment-tests.exit
          ruff check experiments/repricing_graph_v0_1/*.py > recovery/ruff.log 2>&1
          echo $? > recovery/ruff.exit
          set -e
          git bundle create recovery/repository.bundle --all
          sha256sum recovery/repository.bundle > recovery/repository.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: repricing-native-recovery
          path: recovery/
          retention-days: 7
          if-no-files-found: error
