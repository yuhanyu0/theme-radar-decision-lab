name: Apply repricing implementation patch

on:
  push:
    branches:
      - design/repricing-graph-investment-system

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if already applied
        id: guard
        shell: bash
        run: |
          if [ -f .tmp/repricing_patch/APPLIED ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply staged patch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/repricing_patch/00 .tmp/repricing_patch/01 .tmp/repricing_patch/02 .tmp/repricing_patch/03 .tmp/repricing_patch/04 \
            | base64 -d | gunzip > /tmp/repricing.patch
          git apply --check /tmp/repricing.patch
          git apply /tmp/repricing.patch
          touch .tmp/repricing_patch/APPLIED
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/repricing_graph_v0_1 .tmp/repricing_patch/APPLIED
          git commit -m "feat: add experimental repricing graph vertical slice"
          git push
